apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'org.revapi.revapi-gradle-plugin'

sourceSets {
    jmh {
        java {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
}

configurations {
    jmhImplementation.extendsFrom(implementation)
    jmhRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    api project(":ssl-config")
    api "com.palantir.safe-logging:safe-logging"
    api "com.palantir.safe-logging:preconditions"
    api "com.palantir.tokens:auth-tokens"
    implementation "com.google.guava:guava"
    implementation "com.palantir.safe-logging:logger"

    testImplementation project(":extras:jackson-support")
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
    testImplementation "com.palantir.safe-logging:preconditions-assertj"
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.assertj:assertj-core"
    testImplementation "org.mockito:mockito-core"

    annotationProcessor "org.immutables:value"
    compileOnly 'org.immutables:value::annotations'

    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess'
    jmhImplementation sourceSets.main.output
    jmhImplementation 'org.openjdk.jmh:jmh-core'
}

// Convenience method to run benchmarks.
// example usage: ./gradlew benchmark -Pjmh="UserAgentsBenchmark -wi 2 -i 8"
tasks.register('benchmark', JavaExec) {
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.jmh.runtimeClasspath

    if (project.hasProperty('jmh')) {
        args(project.property('jmh').split(' '))
    }
}
